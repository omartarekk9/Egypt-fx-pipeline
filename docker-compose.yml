services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set a password}
      POSTGRES_DB: ${POSTGRES_DB:-fxtracker}
    ports:
      - "5433:5432"   # 5433 on the host so it never clashes with another Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/postgres:/docker-entrypoint-initdb.d:ro   # *.sql here runs once, on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  pipeline:
    build: .
    profiles: ["run"]   # not started by `docker compose up`; run it on demand
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FX_BACKEND: postgres
      FX_PG_HOST: postgres   # the service name is the hostname on the compose network
      FX_PG_PORT: "5432"     # inside the network it is 5432, not the published 5433
      POSTGRES_USER: ${POSTGRES_USER:-fx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set a password}
      POSTGRES_DB: ${POSTGRES_DB:-fxtracker}

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    profiles: ["airflow"]   # start it on demand: docker compose up -d airflow
    depends_on:
      postgres:
        condition: service_healthy
    command: standalone      # one container running scheduler, API server and DAG processor
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"   # local use only: no login screen
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-fx}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      PYTHONPATH: /opt/airflow   # so the DAG can `import src...`
      FX_PG_HOST: postgres
      FX_PG_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-fx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set a password}
      POSTGRES_DB: ${POSTGRES_DB:-fxtracker}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data

volumes:
  pgdata:
